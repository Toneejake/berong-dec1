# BFP Berong - Nginx Configuration with SSL
# For production deployment with HTTPS

# --- Real IP from Cloudflare ---
# Use CF-Connecting-IP header to get real user IP (behind Cloudflare proxy)
# This maps to the actual user IP, not Cloudflare's edge IP
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ''      $binary_remote_addr;
}

# --- Rate Limiting Zones (using real client IP) ---
# Auth endpoints: 5 requests/minute per IP (brute force protection)
limit_req_zone $real_client_ip zone=auth:10m rate=5r/m;
# API endpoints: 20 requests/second per IP
limit_req_zone $real_client_ip zone=api:10m rate=20r/s;
# Simulation endpoints: 1 request/minute per IP (expensive AI processing)
limit_req_zone $real_client_ip zone=simulation:10m rate=1r/m;
# Chatbot endpoints: 5 requests/minute per IP
limit_req_zone $real_client_ip zone=chatbot:10m rate=5r/m;
# General traffic: 30 requests/second per IP
limit_req_zone $real_client_ip zone=general:10m rate=30r/s;
# Standard 429 response for rate-limited requests
limit_req_status 429;

# --- Connection Limits ---
# Per-IP connection limit
limit_conn_zone $real_client_ip zone=perip:10m;
# Total server connection limit
limit_conn_zone $server_name zone=total:10m;
limit_conn_status 429;

# --- Proxy Cache ---
proxy_cache_path /var/cache/nginx/app levels=1:2 keys_zone=app_cache:20m max_size=500m inactive=10m use_temp_path=off;

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Skip cache for logged-in users (cookie names with hyphens/dots can't be used as nginx variables)
map $http_cookie $no_cache {
    default 0;
    "~*next-auth\.session-token" 1;
    "~*auth_token" 1;
}

# Hide nginx version in headers and error pages
server_tokens off;

upstream nextjs {
    server nextjs:3000;
    keepalive 64;
}

upstream python_backend {
    server python-backend:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    server_name bfpscberong.app www.bfpscberong.app;
    
    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check (needed for Docker healthcheck on port 80)
    location /nginx-health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl default_server;
    http2 on;
    server_name bfpscberong.app www.bfpscberong.app;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/bfpscberong.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bfpscberong.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS (uncomment after confirming SSL works)
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com; frame-src 'self' https://www.youtube.com https://www.facebook.com; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_comp_level 6;
    
    # Client body size (for file uploads — reduced from 50M for security)
    client_max_body_size 15M;
    
    # Proxy timeouts (important for AI processing)
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Cache lock prevents thundering herd (only 1 request fetches, others wait)
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    
    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
    
    # --- Rate-limited auth endpoints (brute force protection) ---
    location /api/auth/login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Simulation STATUS polling (lightweight DB lookup, needs frequent polling) ---
    location /api/simulation/status/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Rate-limited simulation endpoints (expensive AI processing) ---
    location /api/simulation/ {
        limit_req zone=simulation burst=1 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Rate-limited chatbot endpoint (Gemini API cost control) ---
    location /api/chatbot/ {
        limit_req zone=chatbot burst=3 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Cacheable read-only API endpoints (blogs, videos, carousel, etc.) ---
    location ~ ^/api/(blogs|videos|carousel|assessment/questions|kids|quick-questions|content) {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cache GET responses for 60 seconds
        proxy_cache app_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 60s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # --- Rate-limited API endpoints (non-cacheable: auth, mutations) ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python Backend - Disabled in production (uncomment for debugging)
    # location /backend/ {
    #     limit_req zone=simulation burst=2 nodelay;
    #     proxy_pass http://python_backend/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # Static files - Cache aggressively (fingerprinted by Next.js, safe to cache forever)
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache app_cache;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 30d;
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache app_cache;
        proxy_cache_valid 200 1h;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static assets (images, fonts, PDFs, WASM) - cache 7 days
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp4|webm|pdf|wasm|ttf|woff|woff2|eot|otf)$ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache app_cache;
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status;
        expires 7d;
    }
    
    # Uploaded files
    location /uploads/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
        # Re-add security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    
    # ALL remaining requests go to Next.js (pages, assets)
    # Games location — Ren'Py/Emscripten web games require unsafe-eval
    location /games/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cache game assets
        proxy_cache app_cache;
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Cache-Control Set-Cookie;
        # Override CSP to allow unsafe-eval for Emscripten games
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        limit_conn perip 150;
        limit_conn total 800;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Cache SSR pages for 60 seconds — dramatically reduces server load
        proxy_cache app_cache;
        proxy_cache_valid 200 60s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Don't cache for logged-in users (they have session cookies)
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;
        add_header X-Cache-Status $upstream_cache_status;

        # Standard timeout for page loads
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
